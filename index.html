<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exness Lot Size Calculator & Journal</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --input-bg: #21262d;
      --text-color: #c9d1d9;
      --accent-color: #2ea043;
      --danger-color: #f85149;
      --border-color: #30363d;
      --highlight-color: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .nav-buttons {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .nav-buttons button {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-buttons button:hover, .nav-buttons button.active {
      background-color: var(--highlight-color);
      color: #fff;
      border-color: var(--highlight-color);
    }

    .box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    #journalPage {
      max-width: 1200px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #8b949e;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--highlight-color);
    }

    .toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      padding: 12px;
      background-color: rgba(88, 166, 255, 0.1);
      border: 1px solid var(--highlight-color);
      border-radius: 8px;
    }
    
    .toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
    }

    .btn-main {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-main:hover { opacity: 0.9; }

    .result-box {
      margin-top: 24px;
      background-color: rgba(46, 160, 67, 0.1);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .result-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 8px 0;
    }

    .details {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 6px;
      display: flex;
      justify-content: space-around;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-sub {
      flex: 1;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-sub:hover { background-color: var(--border-color); }

    /* Journal Styles */
    .stats-box {
      display: flex;
      justify-content: space-between;
      background-color: var(--input-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    
    .stats-box div {
      text-align: center;
    }
    
    .stats-box span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1000px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px;
      border: 1px solid var(--border-color);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: var(--input-bg);
      color: #8b949e;
    }

    td select { padding: 6px; font-size: 0.85rem; }
    
    .pnl-input {
      width: 70px;
      padding: 6px;
      font-size: 0.85rem;
    }

    .win-text { color: var(--accent-color); font-weight: bold; }
    .loss-text { color: var(--danger-color); font-weight: bold; }
    .be-text { color: #8b949e; font-weight: bold; }

    textarea {
      width: 100%;
      min-height: 40px;
      background-color: var(--input-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px;
      resize: vertical;
    }

    .btn-del {
      background: var(--danger-color);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="nav-buttons">
  <button id="navCalc" class="active" onclick="showPage('calc')">Calculator</button>
  <button id="navJour" onclick="showPage('jour')">Trade Journal</button>
</div>

<!-- CALCULATOR SECTION -->
<div class="box" id="calculatorPage">
  <h2>Position Size Calculator</h2>

  <div class="form-group">
    <label>Trading Symbol</label>
    <select id="pairSelect" onchange="calculate()">
      <optgroup label="Metals & Commodities">
        <option value="XAUUSD.x">XAUUSD.x (Gold)</option>
        <option value="XAGUSD.x">XAGUSD.x (Silver)</option>
        <option value="WTI.x">WTI.x (US Crude Oil)</option>
        <option value="BRENT.x">BRENT.x (Brent Oil)</option>
      </optgroup>
      <optgroup label="Indices">
        <option value="NAS100.x">NAS100.x (Nasdaq)</option>
        <option value="US30.x">US30.x (Dow Jones)</option>
        <option value="SPX500.x">SPX500.x (S&P 500)</option>
        <option value="GER40.x">GER40.x (DAX 40)</option>
        <option value="UK100.x">UK100.x (FTSE 100)</option>
        <option value="AUS200.x">AUS200.x (ASX 200)</option>
        <option value="JAP225.x">JAP225.x (Nikkei 225)</option>
      </optgroup>
      <optgroup label="Crypto">
        <option value="BTCUSD.x">BTCUSD.x (Bitcoin)</option>
        <option value="ETHUSD.x">ETHUSD.x (Ethereum)</option>
      </optgroup>
      <optgroup label="Forex">
        <option value="EURUSD.x">EURUSD.x</option>
        <option value="GBPUSD.x">GBPUSD.x</option>
        <option value="AUDUSD.x">AUDUSD.x</option>
        <option value="NZDUSD.x">NZDUSD.x</option>
        <option value="USDJPY.x">USDJPY.x</option>
        <option value="USDCHF.x">USDCHF.x</option>
        <option value="USDCAD.x">USDCAD.x</option>
        <option value="EURGBP.x">EURGBP.x</option>
        <option value="AUDCAD.x">AUDCAD.x</option>
      </optgroup>
    </select>
  </div>

  <div class="toggle">
    <span>Use Account % Risk</span>
    <input type="checkbox" id="riskMode" onchange="toggleRiskMode()">
  </div>

  <div id="manualRisk" class="form-group">
    <label>Risk Amount ($ USD)</label>
    <input type="number" id="riskAmount" placeholder="e.g. 50" value="50" oninput="calculate()">
  </div>

  <div id="percentRisk" style="display:none;">
    <div class="form-group">
      <label>Account Balance ($)</label>
      <input type="number" id="accountSize" placeholder="e.g. 10000" oninput="calculate()">
    </div>
    <div class="form-group">
      <label>Risk Percentage (%)</label>
      <input type="number" id="riskPercent" placeholder="e.g. 1" value="1" oninput="calculate()">
    </div>
  </div>

  <div class="form-group">
    <label>Entry Price</label>
    <input type="number" id="entryInput" step="any" placeholder="e.g. 2400.00" oninput="calculate()">
  </div>

  <div class="form-group">
    <label>Stop Loss Price (SL)</label>
    <input type="number" id="slInput" step="any" placeholder="e.g. 2390.00" oninput="calculate()">
  </div>

  <div class="form-group">
    <label>Take Profit Price (TP) - Optional</label>
    <input type="number" id="tpInput" step="any" placeholder="e.g. 2420.00" oninput="calculate()">
  </div>

  <div class="result-box">
    <div style="font-size: 0.85rem; color: #8b949e; text-transform: uppercase;">Recommended Lot Size</div>
    <div class="result-value" id="lotResult">0.00</div>
    <div class="details">
      <span id="riskDisplay">Risk: $0.00</span>
      <span id="rrDisplay">RR: 1:0.00</span>
    </div>
    
    <div class="action-buttons">
      <button class="btn-sub" onclick="copyLot()">Copy Lot</button>
      <button class="btn-sub" onclick="saveToJournal()" style="background-color: var(--highlight-color); color: #000;">Save to Journal</button>
    </div>
  </div>
</div>

<!-- JOURNAL SECTION -->
<div class="box" id="journalPage" style="display:none;">
  <h2>Trade Journal</h2>

  <div class="form-group" style="max-width: 200px;">
    <label>Select Month</label>
    <select id="monthSelect" onchange="changeMonth(this.value)"></select>
  </div>

  <div class="stats-box" id="statsBox">
    <!-- Stats injected via JS -->
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Asset</th>
          <th>Entry</th>
          <th>SL</th>
          <th>TP</th>
          <th>RR</th>
          <th>Risk</th>
          <th>Lot</th>
          <th>Result</th>
          <th>PnL ($)</th>
          <th>Notes</th>
          <th>❌</th>
        </tr>
      </thead>
      <tbody id="journalBody"></tbody>
    </table>
  </div>
</div>

<script>
  // Exness Standard Contract Specifications
  const PAIRS = {
    "XAUUSD.x": { contractSize: 100, quote: "USD" },
    "XAGUSD.x": { contractSize: 5000, quote: "USD" },
    "WTI.x":    { contractSize: 1000, quote: "USD" },
    "BRENT.x":  { contractSize: 1000, quote: "USD" },
    "NAS100.x": { contractSize: 1, quote: "USD" },
    "SPX500.x": { contractSize: 1, quote: "USD" },
    "US30.x":   { contractSize: 1, quote: "USD" },
    "UK100.x":  { contractSize: 1, quote: "GBP", conversion: 1.337 },
    "JAP225.x": { contractSize: 1, quote: "JPY", conversion: 1 / 162.97 },
    "GER40.x":  { contractSize: 1, quote: "EUR", conversion: 1.14 },
    "AUS200.x": { contractSize: 1, quote: "AUD", conversion: 0.70 },
    "BTCUSD.x": { contractSize: 1, quote: "USD" },
    "ETHUSD.x": { contractSize: 1, quote: "USD" },
    "EURUSD.x": { contractSize: 100000, quote: "USD" },
    "GBPUSD.x": { contractSize: 100000, quote: "USD" },
    "AUDUSD.x": { contractSize: 100000, quote: "USD" },
    "NZDUSD.x": { contractSize: 100000, quote: "USD" },
    "USDJPY.x": { contractSize: 100000, type: "USD_BASE" },
    "USDCHF.x": { contractSize: 100000, type: "USD_BASE" },
    "USDCAD.x": { contractSize: 100000, type: "USD_BASE" },
    "EURGBP.x": { contractSize: 100000, quote: "GBP", conversion: 1.337 },
    "AUDCAD.x": { contractSize: 100000, quote: "CAD", conversion: 1 / 1.409 }
  };

  let activeMonth = new Date().toISOString().slice(0,7);
  let currentCalculation = null; // Stores current valid calculation to save to journal

  /* ---------- NAVIGATION ---------- */
  function showPage(page) {
    document.getElementById('calculatorPage').style.display = page === 'calc' ? 'block' : 'none';
    document.getElementById('journalPage').style.display = page === 'jour' ? 'block' : 'none';
    document.getElementById('navCalc').classList.toggle('active', page === 'calc');
    document.getElementById('navJour').classList.toggle('active', page === 'jour');
    if(page === 'jour') {
      loadMonthOptions();
      loadJournal();
    }
  }

  function toggleRiskMode() {
    const isPercent = document.getElementById('riskMode').checked;
    document.getElementById('manualRisk').style.display = isPercent ? "none" : "block";
    document.getElementById('percentRisk').style.display = isPercent ? "block" : "none";
    calculate();
  }

  /* ---------- CALCULATOR ---------- */
  function calculate() {
    const symbol = document.getElementById("pairSelect").value;
    const entry = parseFloat(document.getElementById("entryInput").value);
    const sl = parseFloat(document.getElementById("slInput").value);
    const tp = parseFloat(document.getElementById("tpInput").value);
    const isPercent = document.getElementById("riskMode").checked;

    let risk = 0;
    if (isPercent) {
      const acc = parseFloat(document.getElementById("accountSize").value);
      const pct = parseFloat(document.getElementById("riskPercent").value);
      if(acc && pct) risk = acc * (pct / 100);
    } else {
      risk = parseFloat(document.getElementById("riskAmount").value);
    }

    const resultElem = document.getElementById("lotResult");
    const riskElem = document.getElementById("riskDisplay");
    const rrElem = document.getElementById("rrDisplay");

    if (isNaN(risk) || isNaN(entry) || isNaN(sl) || entry === sl || risk <= 0) {
      resultElem.innerText = "0.00";
      riskElem.innerText = `Risk: $0.00`;
      rrElem.innerText = `RR: 1:0.00`;
      currentCalculation = null;
      return;
    }

    const priceDiff = Math.abs(entry - sl);
    const config = PAIRS[symbol];
    let lotValuePerPriceUnit = config.contractSize;

    if (config.type === "USD_BASE") {
      const avgPrice = (entry + sl) / 2;
      lotValuePerPriceUnit = config.contractSize / avgPrice;
    } else if (config.conversion) {
      lotValuePerPriceUnit = config.contractSize * config.conversion;
    }

    let calculatedLot = risk / (priceDiff * lotValuePerPriceUnit);
    let formattedLot = calculatedLot < 0.01 ? calculatedLot.toFixed(3) : calculatedLot.toFixed(2);

    let rrRatio = 0;
    if (!isNaN(tp) && tp !== entry) {
      rrRatio = Math.abs(tp - entry) / priceDiff;
    }

    resultElem.innerText = formattedLot;
    riskElem.innerText = `Risk: $${risk.toFixed(2)}`;
    rrElem.innerText = `RR: 1:${rrRatio.toFixed(2)}`;

    // Store for saving
    currentCalculation = {
      asset: symbol,
      entry: entry,
      sl: sl,
      tp: isNaN(tp) ? "" : tp,
      rr: rrRatio.toFixed(2),
      risk: risk.toFixed(2),
      lot: formattedLot
    };
  }

  function copyLot() {
    const lotText = document.getElementById("lotResult").innerText;
    navigator.clipboard.writeText(lotText);
    alert("Lot size copied: " + lotText);
  }

  /* ---------- STORAGE & JOURNAL ---------- */
  function saveToJournal() {
    if (!currentCalculation) {
      alert("Please calculate a valid lot size first.");
      return;
    }

    const j = JSON.parse(localStorage.tradingJournal || "{}");
    const monthKey = new Date().toISOString().slice(0,7);
    if (!j[monthKey]) j[monthKey] = [];

    j[monthKey].push({
      date: new Date().toISOString().slice(0,10),
      asset: currentCalculation.asset,
      entry: currentCalculation.entry,
      sl: currentCalculation.sl,
      tp: currentCalculation.tp,
      rr: currentCalculation.rr,
      risk: currentCalculation.risk,
      lot: currentCalculation.lot,
      result: "OPEN",
      pnl: null,
      notes: ""
    });

    localStorage.tradingJournal = JSON.stringify(j);
    alert("Trade saved to Journal!");
  }

  function loadJournal() {
    const j = JSON.parse(localStorage.tradingJournal || "{}");
    const t = j[activeMonth] || [];
    const journalBody = document.getElementById("journalBody");
    journalBody.innerHTML = "";

    t.forEach((x, i) => {
      let pnlClass = "";
      let pnlPrefix = "";
      if (x.pnl !== null) {
        if (x.pnl > 0) { pnlClass = "win-text"; pnlPrefix = "+"; }
        else if (x.pnl < 0) { pnlClass = "loss-text"; }
        else { pnlClass = "be-text"; }
      }

      journalBody.innerHTML += `
        <tr>
          <td>${x.date}</td>
          <td><b>${x.asset.split('.')[0]}</b></td>
          <td>${x.entry}</td>
          <td>${x.sl}</td>
          <td>${x.tp || '-'}</td>
          <td>1:${x.rr}</td>
          <td>$${x.risk}</td>
          <td>${x.lot}</td>
          <td>
            <select onchange="updateTrade(${i},'result',this.value);loadJournal()">
              <option ${x.result==="OPEN"?"selected":""}>OPEN</option>
              <option ${x.result==="WIN"?"selected":""}>WIN</option>
              <option ${x.result==="LOSS"?"selected":""}>LOSS</option>
              <option ${x.result==="BE"?"selected":""}>BE</option>
            </select>
          </td>
          <td>
            <input class="pnl-input" type="number" placeholder="$"
              value="${x.pnl === null ? "" : Math.abs(x.pnl)}" 
              onchange="updateTrade(${i},'pnl',this.value);loadJournal()">
            <span class="${pnlClass}" style="margin-left:5px;">
              ${x.pnl === null ? "" : pnlPrefix + x.pnl}
            </span>
          </td>
          <td>
            <textarea placeholder="Trade logic..." onchange="updateTrade(${i},'notes',this.value)">${x.notes}</textarea>
          </td>
          <td><button class="btn-del" onclick="deleteTrade(${i})">X</button></td>
        </tr>`;
    });

    calcStats();
  }

  function updateTrade(i, field, value) {
    const j = JSON.parse(localStorage.tradingJournal || "{}");
    const trade = j[activeMonth][i];

    if (field === "pnl") {
      if (value === "") {
        trade.pnl = null;
      } else {
        const abs = Math.abs(Number(value));
        if (trade.result === "LOSS") trade.pnl = -abs;
        else if (trade.result === "WIN") trade.pnl = abs;
        else trade.pnl = 0;
      }
    }
    else if (field === "result") {
      trade.result = value;
      if (trade.pnl !== null) {
        const abs = Math.abs(trade.pnl);
        if (value === "LOSS") trade.pnl = -abs;
        else if (value === "WIN") trade.pnl = abs;
        else trade.pnl = 0;
      }
    }
    else {
      trade[field] = value;
    }

    localStorage.tradingJournal = JSON.stringify(j);
  }

  function deleteTrade(i) {
    if (!confirm("Are you sure you want to delete this trade?")) return;
    const j = JSON.parse(localStorage.tradingJournal || "{}");
    j[activeMonth].splice(i,1);
    localStorage.tradingJournal = JSON.stringify(j);
    loadJournal();
  }

  /* ---------- MONTHS & STATS ---------- */
  function loadMonthOptions() {
    const j = JSON.parse(localStorage.tradingJournal || "{}");
    const select = document.getElementById("monthSelect");
    select.innerHTML = "";
    
    // Ensure current month always exists in dropdown
    if (!j[activeMonth]) j[activeMonth] = [];
    
    Object.keys(j).sort().reverse().forEach(m => {
      select.innerHTML += `<option value="${m}" ${m===activeMonth?"selected":""}>${m}</option>`;
    });
  }

  function changeMonth(m) {
    activeMonth = m;
    loadJournal();
  }

  function calcStats() {
    const j = JSON.parse(localStorage.tradingJournal || "{}");
    const t = j[activeMonth] || [];

    let w=0, l=0, b=0, p=0;
    t.forEach(x => {
      if(x.result === "WIN") w++;
      if(x.result === "LOSS") l++;
      if(x.result === "BE") b++;
      p += parseFloat(x.pnl) || 0;
    });

    const totalClosed = w + l;
    const wr = totalClosed ? ((w / totalClosed) * 100).toFixed(1) : "0.0";
    let pnlColor = p > 0 ? "var(--accent-color)" : (p < 0 ? "var(--danger-color)" : "#fff");

    document.getElementById("statsBox").innerHTML = `
      <div>Total Trades<br><span>${t.length}</span></div>
      <div>Wins<br><span style="color:var(--accent-color)">${w}</span></div>
      <div>Losses<br><span style="color:var(--danger-color)">${l}</span></div>
      <div>Break Even<br><span style="color:#8b949e">${b}</span></div>
      <div>Win Rate<br><span>${wr}%</span></div>
      <div>Net PnL<br><span style="color:${pnlColor}">$${p.toFixed(2)}</span></div>
    `;
  }
</script>

</body>
</html>
